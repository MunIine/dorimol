name: dorimol
description: "A new Flutter project."
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.9.2
  retrofit: ^4.9.2
  json_annotation: ^4.11.0
  flutter_dotenv: ^6.0.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  talker_flutter: ^5.1.15
  get_it: ^9.2.1
  talker_bloc_logger: ^5.1.15
  talker_dio_logger: ^5.1.15
  auto_route: ^11.1.0
  flutter_launcher_icons: ^0.14.4
  url_launcher: ^6.3.2
  package_info_plus: ^9.0.0
  pinput: ^6.0.2
  dropdown_button2: 2.3.9
  flutter_native_splash: ^2.4.7
  firebase_auth: ^6.2.0
  firebase_core: ^4.5.0
  flutter_secure_storage: 10.0.0
  provider: ^6.1.5+1
  image_picker: ^1.2.1
  permission_handler: ^12.0.1
  path: 1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  retrofit_generator: ^10.2.3
  build_runner: ^2.13.0
  json_serializable: ^6.13.0
  auto_route_generator: ^10.5.0

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: AppIcons
      fonts:
        - asset: lib/assets/fonts/icomoon.ttf

    - family: Rostelecom
      fonts:
        - asset: lib/assets/fonts/Rostelecom-Medium.otf
          weight: 500
        - asset: lib/assets/fonts/Rostelecom-Bold.otf
          weight: 700

  assets:
    - .env
    - lib/assets/errors/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "lib/assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_foreground: "lib/assets/icon/icon_foreground.png"
  adaptive_icon_background: "lib/assets/icon/icon_background.png"
  web:
    generate: true
    image_path: "lib/assets/icon/icon.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "lib/assets/icon/icon.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "lib/assets/icon/icon.png"

flutter_native_splash:
  android: true
  ios: true
  color: "#FFFFFF"
  image: lib/assets/splash_screen/logo.png
  android_12:
    color: "#FFFFFF"
    image: lib/assets/splash_screen/logo_android12.png
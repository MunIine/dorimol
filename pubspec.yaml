name: dorimol
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  retrofit: ^4.6.0
  json_annotation: ^4.9.0
  flutter_dotenv: ^5.2.1
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  retrofit_generator: ^9.6.0
  build_runner: ^2.5.4
  json_serializable: ^6.9.5

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: AppIcons
      fonts:
        - asset: lib/assets/fonts/icomoon.ttf

    - family: Rostelecom
      fonts:
        - asset: lib/assets/fonts/Rostelecom-Medium.otf
          weight: 500
        - asset: lib/assets/fonts/Rostelecom-Bold.otf
          weight: 700

  assets:
    - .env
    - lib/assets/images/categories/fruits.png
    - lib/assets/images/items/
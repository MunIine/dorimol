name: dorimol
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  retrofit: ^4.6.0
  json_annotation: ^4.9.0
  flutter_dotenv: ^5.2.1
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  talker_flutter: ^4.9.2
  get_it: ^8.0.3
  talker_bloc_logger: ^4.9.2
  talker_dio_logger: ^4.9.2
  auto_route: ^10.1.0+1
  flutter_launcher_icons: ^0.14.4
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  retrofit_generator: ^9.6.0
  build_runner: ^2.5.4
  json_serializable: ^6.9.5
  auto_route_generator: ^10.2.3

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: AppIcons
      fonts:
        - asset: lib/assets/fonts/icomoon.ttf

    - family: Rostelecom
      fonts:
        - asset: lib/assets/fonts/Rostelecom-Medium.otf
          weight: 500
        - asset: lib/assets/fonts/Rostelecom-Bold.otf
          weight: 700

  assets:
    - .env

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "lib/assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_foreground: "lib/assets/icon/icon_foreground.png"
  adaptive_icon_background: "lib/assets/icon/icon_background.png"
  web:
    generate: true
    image_path: "lib/assets/icon/icon.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "lib/assets/icon/icon.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "lib/assets/icon/icon.png"